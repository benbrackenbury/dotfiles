"$schema" = 'https://starship.rs/config-schema.json'

format="""$hostname$directory$git_branch$git_status$fill\
$cmd_duration$time
$character"""

add_newline = true

[hostname]
format = '[$hostname]($style) '
style = "dimmed white"

[git_branch]
format = '[$branch]($style) '

[git_status]
format = '([$all_status$ahead_behind]($style) )'
modified = '!${count} '
staged = '+${count} '
untracked = '?${count} '
deleted = '-${count} '
renamed = '»${count} '
conflicted = '=${count} '
stashed = ''
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇡${ahead_count}⇣${behind_count} '

[character]
success_symbol = '[➜](bold green)'

[cmd_duration]
min_time = 500 
style = "yellow"
format = '[$duration · ]($style)'

[fill]
symbol = " "

[time]
disabled = false
time_format = '%d/%m/%Y %H:%M'
format = '[$time]($style)'
style = "dimmed white"
