[cli]
installer = "internal"
auto_update = true
channel = "alpha"
show_tips = true

[ui]
theme = "system"
auto_dark_theme = "groknight"
auto_light_theme = "grokday"
max_thoughts_width = 120
fork_secondary_model = "grok-build"
yolo = false
permission_mode = "always-approve"
simple_mode = false
compact_mode = true
vim_mode = true
show_timeline = true
page_flip_on_send = true

[ui.display_refresh]
auto_cadence_enabled = true

[plugins]
enabled = [
    "user/7c4108cf/github",
    "user/e66f25e3/commit-commands",
]
disabled = []

[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[mcp_servers.Xcode]
command = "xcode"
args = [
    "xcrun",
    "mcpbridge",
]
enabled = true

[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]
enabled = true

[mcp_servers.fusion360]
url = "http://127.0.0.1:27182/mcp"
enabled = true

[privacy]
privacy_banner_acked = "2026-08-08T08:14:58Z"

[models]
default = "grok-4.6"
default_reasoning_effort = "xhigh"
